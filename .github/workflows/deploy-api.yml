name: deploy-api
on:
  push:
    branches: [main]
    paths: ["api/**"]
  workflow_dispatch:
# Same reasoning as deploy-web: only the latest commit's Worker should be live.
concurrency:
  group: deploy-api
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least-privilege: reads the repo, deploys via its own scoped Cloudflare token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: {node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json}
      - run: cd api && npm ci && npm run typecheck
      - name: Deploy Worker
        # NOTE: CLOUDFLARE_API_TOKEN is currently scoped for Pages only. A Worker
        # deploy needs Workers Scripts:Edit, and the R2 binding needs the
        # beholden-private bucket to exist. Both are one-time setup steps — this
        # job fails loudly until they are done, which is the right failure.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
