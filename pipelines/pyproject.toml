[project]
name = "beholden-etl"
version = "0.1.0"
description = "Beholden nightly ETL: fetch -> land -> transform (DuckDB) -> build -> publish"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "tenacity>=8.2",
  "boto3>=1.34",     # S3-compatible client for R2 publish
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beholden_etl*"]

[tool.setuptools.package-data]
# WO-19: the committed, human-reviewed WA PDC person allowlist ships with the
# package (bulk/crosswalk.py loads it next to its own source file).
beholden_etl = ["bulk/*.json"]

# Lint contract, stated explicitly (WO-29). Without this the rule set is
# whatever the installed ruff version happens to default to — and those defaults
# widened between releases, so `ruff check` reported 0 findings on one machine
# and 57 on another against identical code. An unpinned gate that disagrees with
# itself is not a gate. These are the rules the codebase is clean under today;
# widening the set is a deliberate change with its own cleanup pass, not
# something a dependency bump should do silently.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
